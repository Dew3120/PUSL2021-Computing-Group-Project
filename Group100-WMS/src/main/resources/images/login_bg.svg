<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e2d45;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f35;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.4">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="240" y1="0" x2="240" y2="1080"/>
    <line x1="480" y1="0" x2="480" y2="1080"/>
    <line x1="720" y1="0" x2="720" y2="1080"/>
    <line x1="960" y1="0" x2="960" y2="1080"/>
    <line x1="1200" y1="0" x2="1200" y2="1080"/>
    <line x1="1440" y1="0" x2="1440" y2="1080"/>
    <line x1="1680" y1="0" x2="1680" y2="1080"/>
  </g>
  <!-- Warehouse shelves left -->
  <g opacity="0.15" fill="none" stroke="#3498db" stroke-width="2">
    <rect x="40" y="200" width="160" height="20"/>
    <rect x="40" y="300" width="160" height="20"/>
    <rect x="40" y="400" width="160" height="20"/>
    <rect x="40" y="500" width="160" height="20"/>
    <rect x="40" y="600" width="160" height="20"/>
    <rect x="40" y="700" width="160" height="20"/>
    <line x1="40" y1="200" x2="40" y2="720"/>
    <line x1="200" y1="200" x2="200" y2="720"/>
    <rect x="60" y="220" width="30" height="80" fill="#3498db" opacity="0.3"/>
    <rect x="100" y="220" width="30" height="80" fill="#3498db" opacity="0.3"/>
    <rect x="140" y="220" width="30" height="80" fill="#3498db" opacity="0.3"/>
    <rect x="60" y="320" width="30" height="80" fill="#2ecc71" opacity="0.3"/>
    <rect x="100" y="320" width="30" height="80" fill="#2ecc71" opacity="0.3"/>
    <rect x="140" y="320" width="30" height="80" fill="#2ecc71" opacity="0.3"/>
    <rect x="60" y="420" width="30" height="80" fill="#e74c3c" opacity="0.3"/>
    <rect x="100" y="420" width="30" height="80" fill="#e74c3c" opacity="0.3"/>
    <rect x="140" y="420" width="30" height="80" fill="#e74c3c" opacity="0.3"/>
  </g>
  <!-- Warehouse shelves right -->
  <g opacity="0.15" fill="none" stroke="#3498db" stroke-width="2">
    <rect x="1720" y="200" width="160" height="20"/>
    <rect x="1720" y="300" width="160" height="20"/>
    <rect x="1720" y="400" width="160" height="20"/>
    <rect x="1720" y="500" width="160" height="20"/>
    <rect x="1720" y="600" width="160" height="20"/>
    <rect x="1720" y="700" width="160" height="20"/>
    <line x1="1720" y1="200" x2="1720" y2="720"/>
    <line x1="1880" y1="200" x2="1880" y2="720"/>
    <rect x="1740" y="220" width="30" height="80" fill="#f39c12" opacity="0.3"/>
    <rect x="1780" y="220" width="30" height="80" fill="#f39c12" opacity="0.3"/>
    <rect x="1820" y="220" width="30" height="80" fill="#f39c12" opacity="0.3"/>
    <rect x="1740" y="320" width="30" height="80" fill="#9b59b6" opacity="0.3"/>
    <rect x="1780" y="320" width="30" height="80" fill="#9b59b6" opacity="0.3"/>
    <rect x="1820" y="320" width="30" height="80" fill="#9b59b6" opacity="0.3"/>
    <rect x="1740" y="420" width="30" height="80" fill="#3498db" opacity="0.3"/>
    <rect x="1780" y="420" width="30" height="80" fill="#3498db" opacity="0.3"/>
    <rect x="1820" y="420" width="30" height="80" fill="#3498db" opacity="0.3"/>
  </g>
  <!-- Boxes bottom -->
  <g opacity="0.12">
    <rect x="300" y="900" width="80" height="80" rx="4" fill="#3498db"/>
    <rect x="400" y="920" width="60" height="60" rx="4" fill="#2ecc71"/>
    <rect x="480" y="910" width="70" height="70" rx="4" fill="#3498db"/>
    <rect x="1400" y="900" width="80" height="80" rx="4" fill="#e74c3c"/>
    <rect x="1500" y="920" width="60" height="60" rx="4" fill="#f39c12"/>
    <rect x="1580" y="910" width="70" height="70" rx="4" fill="#9b59b6"/>
  </g>
  <!-- Conveyor belt bottom -->
  <g opacity="0.1">
    <rect x="0" y="980" width="1920" height="40" fill="#3498db"/>
    <line x1="0" y1="980" x2="1920" y2="980" stroke="#2980b9" stroke-width="2"/>
    <line x1="100" y1="980" x2="100" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="200" y1="980" x2="200" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="300" y1="980" x2="300" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="400" y1="980" x2="400" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="500" y1="980" x2="500" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="600" y1="980" x2="600" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="700" y1="980" x2="700" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="800" y1="980" x2="800" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="900" y1="980" x2="900" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="1000" y1="980" x2="1000" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="1100" y1="980" x2="1100" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="1200" y1="980" x2="1200" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="1300" y1="980" x2="1300" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="1400" y1="980" x2="1400" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="1500" y1="980" x2="1500" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="1600" y1="980" x2="1600" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="1700" y1="980" x2="1700" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="1800" y1="980" x2="1800" y2="1020" stroke="#2980b9" stroke-width="1"/>
    <line x1="1900" y1="980" x2="1900" y2="1020" stroke="#2980b9" stroke-width="1"/>
  </g>
  <!-- Glowing orbs -->
  <circle cx="960" cy="100" r="200" fill="#3498db" opacity="0.04"/>
  <circle cx="300" cy="540" r="150" fill="#2ecc71" opacity="0.04"/>
  <circle cx="1620" cy="540" r="150" fill="#9b59b6" opacity="0.04"/>
  <!-- Accent line top -->
  <rect x="0" y="0" width="1920" height="4" fill="url(#accent)"/>
  <!-- Accent line bottom -->
  <rect x="0" y="1076" width="1920" height="4" fill="url(#accent)"/>
  <!-- Dots pattern -->
  <g fill="#3498db" opacity="0.08">
    <circle cx="600" cy="200" r="3"/>
    <circle cx="700" cy="200" r="3"/>
    <circle cx="800" cy="200" r="3"/>
    <circle cx="1120" cy="200" r="3"/>
    <circle cx="1220" cy="200" r="3"/>
    <circle cx="1320" cy="200" r="3"/>
    <circle cx="600" cy="880" r="3"/>
    <circle cx="700" cy="880" r="3"/>
    <circle cx="800" cy="880" r="3"/>
    <circle cx="1120" cy="880" r="3"/>
    <circle cx="1220" cy="880" r="3"/>
    <circle cx="1320" cy="880" r="3"/>
  </g>
</svg>